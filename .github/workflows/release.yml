name: Build APK

# Every push builds and tests. A push to the default branch also publishes a
# signed release, so the newest APK is always one click away on the releases
# page.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # versionCode has to climb or a phone refuses the upgrade, and the only
      # number that reliably climbs here is the run number. Stamped at build
      # time rather than committed, so the Gradle files stay byte-identical to
      # the sources this repo mirrors and a re-sync never conflicts.
      - name: Stamp version
        id: version
        run: |
          set -euo pipefail
          CODE=$(( ${{ github.run_number }} + 1000 ))
          NAME="1.0.${{ github.run_number }}"
          sed -i "s/^\( *versionCode *= *\).*/\1${CODE}/" app/build.gradle.kts
          sed -i "s/^\( *versionName *= *\).*/\1\"${NAME}\"/" app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Instrumented tests need a device, so only the JVM ones run here.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set - this build produces an unsigned APK, which Android will refuse to install."
          fi

      # Signing lives here instead of in a Gradle signingConfig for the same
      # reason as the version stamp: nothing in the mirrored sources has to
      # know that this repo publishes releases.
      - name: Package APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILT=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$BUILT" || { echo "no APK produced"; exit 1; }
          echo "built: $BUILT"

          if [ "${{ steps.secrets.outputs.present }}" != "true" ]; then
            OUT="ATC_BLE_OEPL_NFC-${{ steps.version.outputs.name }}-unsigned.apk"
            cp "$BUILT" "$OUT"
            echo "path=$OUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          OUT="ATC_BLE_OEPL_NFC-${{ steps.version.outputs.name }}.apk"
          "$BT/zipalign" -p -f 4 "$BUILT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          {
            echo "Automatic build of \`${GITHUB_SHA:0:7}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo
            if [ "${{ steps.secrets.outputs.present }}" = "true" ]; then
              echo "Signed with the project release key."
            else
              echo "> **Unsigned** - signing secrets are not configured in this repository."
            fi
            echo
            echo "### Commit"
            echo
            git log -1 --pretty=format:'%s%n%n%b'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            "${{ steps.apk.outputs.path }}"
