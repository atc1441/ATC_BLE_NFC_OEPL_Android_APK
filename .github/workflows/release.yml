name: Build APK

# Every push builds and tests. A push to the default branch also publishes a
# signed release, so the newest APK is always one click away on the releases
# page.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set - this build produces an unsigned APK, which Android will refuse to install."
          fi

      # versionCode has to climb or a phone refuses the upgrade, and the only
      # number that reliably climbs here is the run number. build.gradle.kts
      # reads it from the environment, so nothing in the tree is rewritten and
      # a local build and this one stay the same build.
      - name: Pick version
        id: version
        run: |
          set -euo pipefail
          echo "code=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Instrumented tests need a device, so only the JVM ones run here.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      # The keystore is written to disk and handed to Gradle, which signs via
      # the signingConfig in app/build.gradle.kts - the same code path a local
      # release build takes. One signing path means an APK built here and one
      # built by hand carry the same signature, so either upgrades the other
      # instead of demanding an uninstall.
      - name: Assemble release
        env:
          OEPL_VERSION_CODE: ${{ steps.version.outputs.code }}
          OEPL_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          OEPL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OEPL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OEPL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          if [ "${{ steps.secrets.outputs.present }}" = "true" ]; then
            export OEPL_KEYSTORE="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$OEPL_KEYSTORE"
          fi
          ./gradlew --no-daemon assembleRelease

      # Gradle has already signed; this only gives the APK a name worth
      # downloading and checks the signature is the one it should be.
      - name: Package APK
        id: apk
        run: |
          set -euo pipefail
          BUILT=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$BUILT" || { echo "no APK produced"; exit 1; }
          echo "built: $BUILT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          if [ "${{ steps.secrets.outputs.present }}" != "true" ]; then
            OUT="ATC_BLE_OEPL_NFC-${{ steps.version.outputs.name }}-unsigned.apk"
            cp "$BUILT" "$OUT"
            echo "path=$OUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUT="ATC_BLE_OEPL_NFC-${{ steps.version.outputs.name }}.apk"
          "$BT/zipalign" -p -f 4 "$BUILT" "$OUT"
          "$BT/apksigner" verify --print-certs "$OUT"

          # The whole point of a fixed key is that this digest never changes.
          # If it ever does, every installed copy would need an uninstall, so
          # the build fails rather than shipping a stranger's signature.
          EXPECTED=76cb3e15b3fafb989bcfa47cd52073fd4f6d3c3465851fd141d40e2495ac81ec
          GOT=$("$BT/apksigner" verify --print-certs "$OUT"             | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::APK signed with the wrong key. expected $EXPECTED, got $GOT"
            exit 1
          fi
          echo "signature verified: $GOT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          {
            echo "Automatic build of \`${GITHUB_SHA:0:7}\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${{ steps.version.outputs.name }}\` |"
            echo "| versionCode | \`${{ steps.version.outputs.code }}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo
            if [ "${{ steps.secrets.outputs.present }}" = "true" ]; then
              echo "Signed with the project release key."
            else
              echo "> **Unsigned** - signing secrets are not configured in this repository."
            fi
            echo
            echo "### Commit"
            echo
            git log -1 --pretty=format:'%s%n%n%b'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            "${{ steps.apk.outputs.path }}"
